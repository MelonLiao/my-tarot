<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>塔羅覺察練習與個人資料庫 | Tarot Codex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f17;
      --card-bg: #161b2b;
      --card-border: #2e3856;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dark: #aa820a;
      --accent: #9381ff;
      --text-main: #f0f2f5;
      --text-muted: #9aa5b8;
      --danger: #ff6b6b;
      --success: #51cf66;
      --radius: 14px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Noto Serif TC', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(ellipse at 50% 0%, rgba(147, 129, 255, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
      background-attachment: fixed;
    }

    header {
      background: rgba(13, 15, 23, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 18px;
    }
    .header-content {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .brand-icon {
      font-size: 24px;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }
    .brand-text h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      letter-spacing: 1px;
      color: var(--gold-light);
    }
    .brand-text p {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    nav {
      display: flex;
      gap: 6px;
      background: rgba(22, 27, 43, 0.8);
      padding: 4px;
      border-radius: 40px;
      border: 1px solid var(--card-border);
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .nav-btn.active {
      background: var(--gold);
      color: #0d0f17;
      box-shadow: 0 2px 8px rgba(212, 175, 55, 0.35);
    }

    main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    .tab-view { display: none; }
    .tab-view.active { display: block; animation: fadeIn 0.35s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #0d0f17;
      border: none;
      padding: 10px 22px;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4); }
    .btn:active { transform: translateY(0); }
    .btn-secondary {
      background: transparent;
      color: var(--gold-light);
      border: 1px solid var(--gold);
      box-shadow: none;
    }
    .btn-secondary:hover { background: rgba(212, 175, 55, 0.1); }
    .btn-sm { padding: 6px 14px; font-size: 0.8rem; }

    /* ==========================================================
       卡牌核心容器（固定 160px × 275px）
       ========================================================== */
    .rws-card {
      width: 160px;
      height: 275px;
      position: relative;
      cursor: pointer;
      user-select: none;
      border-radius: 10px;
      box-shadow: var(--shadow);
      border: 2px solid var(--card-border);
      background-color: #101524;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .rws-card:not(.flipped):hover {
      transform: translateY(-6px);
      border-color: var(--gold);
      box-shadow: 0 12px 28px rgba(212, 175, 55, 0.3);
    }

    .card-face-back, .card-face-front {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transition: opacity 0.4s ease;
    }

    .card-face-back {
      background: radial-gradient(circle at center, #232d4b 0%, #101524 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      opacity: 1;
      gap: 12px;
    }
    .card-face-back::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px dashed rgba(212, 175, 55, 0.45);
      border-radius: 6px;
    }
    .card-back-ornament {
      width: 50px;
      height: 50px;
      border: 2px solid var(--gold);
      transform: rotate(45deg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-back-ornament::after {
      content: '✦';
      font-size: 20px;
      color: var(--gold);
      transform: rotate(-45deg);
    }
    .card-click-hint {
      font-size: 0.75rem;
      color: var(--gold-light);
      background: rgba(13, 15, 23, 0.7);
      padding: 3px 8px;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .card-face-front {
      z-index: 1;
      opacity: 0;
      background: #000;
    }
    .card-face-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .rws-card.flipped .card-face-back {
      opacity: 0;
      pointer-events: none;
    }
    .rws-card.flipped .card-face-front {
      opacity: 1;
      z-index: 3;
    }
    .rws-card.reversed .card-face-front img {
      transform: rotate(180deg);
    }

    .card-badge {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 15, 23, 0.88);
      backdrop-filter: blur(4px);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.72rem;
      white-space: nowrap;
      border: 1px solid var(--gold);
      color: var(--gold-light);
      pointer-events: none;
      z-index: 4;
    }

    /* 覺察佈局 */
    .practice-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .practice-header h2 {
      font-size: 1.5rem;
      color: var(--gold-light);
      margin-bottom: 8px;
    }
    .spread-select-wrap {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 14px 0 20px;
    }
    .spread-chip {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .spread-chip.active {
      border-color: var(--gold);
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold-light);
    }

    /* 頂部提問輸入區 */
    .initial-question-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px 20px;
      max-width: 680px;
      margin: 0 auto 24px;
      text-align: left;
    }

    .cards-row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 24px;
      flex-wrap: wrap;
      margin: 24px 0;
      min-height: 280px;
    }
    .card-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 160px;
    }
    .pos-label {
      font-size: 0.85rem;
      color: var(--gold-light);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .reflection-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 22px;
      margin-top: 24px;
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--gold-light);
      margin-bottom: 6px;
      font-weight: 600;
    }
    textarea, input[type="text"] {
      width: 100%;
      background: rgba(13, 15, 23, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.92rem;
      resize: vertical;
    }
    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
    }

    /* 塔羅出題練習 */
    .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      max-width: 680px;
      margin: 0 auto;
    }
    .scenario-box {
      background: rgba(147, 129, 255, 0.08);
      border-left: 3px solid var(--accent);
      padding: 14px 18px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* 78 張個人圖鑑庫 */
    .codex-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: space-between;
      align-items: center;
    }
    .filter-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .filter-btn.active {
      background: var(--gold);
      color: #0d0f17;
      border-color: var(--gold);
    }
    .codex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 16px;
    }
    .codex-card-thumb {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      flex-direction: column;
    }
    .codex-card-thumb:hover {
      transform: translateY(-4px);
      border-color: var(--gold);
      box-shadow: 0 6px 16px rgba(212, 175, 55, 0.2);
    }
    .thumb-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #111;
    }
    .thumb-info {
      padding: 8px 6px;
      text-align: center;
    }
    .thumb-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--gold-light);
      margin-bottom: 2px;
    }
    .thumb-count {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* 日記列表 */
    .journal-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .journal-entry {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 18px;
      position: relative;
    }
    .journal-entry-header {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-bottom: 10px;
    }
    .journal-tags {
      display: flex;
      gap: 6px;
    }
    .journal-tag {
      background: rgba(147, 129, 255, 0.15);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
    }
    .entry-cards-preview {
      display: flex;
      gap: 12px;
      margin: 12px 0;
      align-items: center;
      flex-wrap: wrap;
    }
    .mini-card {
      width: 48px;
      height: 82px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      position: relative;
    }
    .mini-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mini-card.rev img {
      transform: rotate(180deg);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      border-radius: var(--radius);
      overflow-y: auto;
      padding: 24px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
    }
    .modal-body {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .modal-card-img {
      width: 160px;
      height: 275px;
      border-radius: 8px;
      border: 1px solid var(--gold);
      object-fit: cover;
      box-shadow: var(--shadow);
    }
    .modal-info {
      flex: 1;
      min-width: 240px;
    }

    #shareCanvas { display: none; }
    .preview-modal-img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: var(--shadow);
      margin: 14px 0;
    }

    @media (max-width: 640px) {
      .rws-card { width: 110px; height: 190px; }
      .card-col { width: 110px; }
      .cards-row { gap: 10px; }
      .header-content { justify-content: center; }
      nav { width: 100%; justify-content: space-around; }
      .nav-btn { padding: 6px 10px; font-size: 0.76rem; }
      .modal-body { justify-content: center; text-align: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="brand" onclick="switchTab('practice')">
        <div class="brand-icon">✦</div>
        <div class="brand-text">
          <h1>TAROT CODEX</h1>
          <p>塔羅覺察練習與個人資料庫</p>
        </div>
      </div>
      <nav>
        <button class="nav-btn active" onclick="switchTab('practice')"><span>🔮</span> 覺察抽牌</button>
        <button class="nav-btn" onclick="switchTab('quiz')"><span>⚔️</span> 出題練功</button>
        <button class="nav-btn" onclick="switchTab('codex')"><span>📖</span> 牌卡典籍</button>
        <button class="nav-btn" onclick="switchTab('journal')"><span>📜</span> 塔羅日記</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- TAB 1: 覺察抽牌練習 -->
    <section id="tab-practice" class="tab-view active">
      <div class="practice-header">
        <h2>今天，潛意識想對你說什麼？</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">凝聚意念，先選擇牌陣並寫下你的提問，再進行洗牌。</p>
        
        <div class="spread-select-wrap">
          <div class="spread-chip active" onclick="setSpread('single', this)">單張直覺卡</div>
          <div class="spread-chip" onclick="setSpread('three', this)">身·心·靈 三牌陣</div>
          <div class="spread-chip" onclick="setSpread('timeline', this)">過去·現在·未來</div>
        </div>

        <!-- 優先輸入問題 -->
        <div class="initial-question-box">
          <label style="display:block; font-size:0.88rem; color:var(--gold-light); font-weight:700; margin-bottom:8px;">
            💭 ✦ 沉澱心念 · 寫下你心中的困惑或主題
          </label>
          <input type="text" id="practiceQuestion" placeholder="例如：我對於新專案的內心焦慮從何而來？（也可以留空抽每日指引）">
          <div style="text-align: center; margin-top: 14px;">
            <button class="btn" onclick="shuffleCards()" id="drawBtn">
              <span>🎴</span> 🔮 洗牌 · 喚醒卡牌能量
            </button>
          </div>
        </div>
      </div>

      <!-- 牌陣容器（由使用者手動點擊翻牌） -->
      <div class="cards-row" id="cardsDisplayContainer">
        <!-- 洗牌後呈現在此 -->
      </div>

      <!-- 覺察心得填寫區（翻開牌後呈現） -->
      <div class="reflection-box" id="practiceFormBox" style="display: none;">
        <h3 style="color: var(--gold-light); margin-bottom: 14px; font-size: 1.1rem;">🕊️ 心靈鏡像 · 直覺覺察隨筆</h3>
        <div class="form-group">
          <label>第一眼的視覺感受與牌面直覺：</label>
          <textarea id="practiceIntuition" rows="3" placeholder="看著牌面中的人物、顏色或象徵符號，你心裡湧現的第一直覺是什麼？"></textarea>
        </div>
        <div class="form-group">
          <label>今日覺察轉化行動 (Actionable Insight)：</label>
          <textarea id="practiceAction" rows="2" placeholder="今天我可以做的一件小轉變、轉念或體悟是什麼？"></textarea>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <button class="btn" onclick="savePracticeToJournal()">💾 存入塔羅日記與卡牌庫</button>
          <button class="btn btn-secondary" onclick="generateShareImage()">🎨 產生分享美圖</button>
        </div>
      </div>
    </section>

    <!-- TAB 2: 出題練習 -->
    <section id="tab-quiz" class="tab-view">
      <div class="quiz-card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <h2 style="font-size:1.3rem; color:var(--gold-light);">⚔️ 50+ 實戰情境出題</h2>
          <button class="btn btn-secondary btn-sm" onclick="initNewQuiz()">隨機換題 ↻</button>
        </div>

        <div class="scenario-box" id="quizScenario">正在抽題中...</div>

        <div style="text-align: center; margin: 20px 0;">
          <div class="rws-card flipped" id="quizCardElem" style="cursor: default; margin: 0 auto;">
            <div class="card-face-front" style="opacity: 1;">
              <img id="quizCardImg" src="" alt="">
              <div class="card-badge" id="quizCardBadge"></div>
            </div>
          </div>
          <p id="quizCardName" style="color: var(--gold-light); font-weight: 700; margin-top: 10px;"></p>
        </div>

        <div class="form-group">
          <label>你的專業解讀觀點：</label>
          <textarea id="quizAnswerInput" rows="4" placeholder="如果是你，你會如何引導這位問卜者？這張牌在該情境的核心提醒與盲點是什麼？"></textarea>
        </div>

        <button class="btn" style="width: 100%;" onclick="submitQuizPractice()">送出解讀並歸檔至個人卡牌庫</button>
      </div>
    </section>

    <!-- TAB 3: 78 張卡牌典籍 -->
    <section id="tab-codex" class="tab-view">
      <div class="codex-controls">
        <div class="filter-tabs">
          <button class="filter-btn active" onclick="filterCodex('all', this)">全部 78 張</button>
          <button class="filter-btn" onclick="filterCodex('major', this)">大阿卡納 (22)</button>
          <button class="filter-btn" onclick="filterCodex('wands', this)">權杖 (Wands)</button>
          <button class="filter-btn" onclick="filterCodex('cups', this)">聖杯 (Cups)</button>
          <button class="filter-btn" onclick="filterCodex('swords', this)">寶劍 (Swords)</button>
          <button class="filter-btn" onclick="filterCodex('pentacles', this)">錢幣 (Pentacles)</button>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary btn-sm" onclick="exportData()">匯出備份</button>
          <button class="btn btn-secondary btn-sm" onclick="importDataPrompt()">匯入</button>
        </div>
      </div>
      <div class="codex-grid" id="codexGrid"></div>
    </section>

    <!-- TAB 4: 塔羅日記 -->
    <section id="tab-journal" class="tab-view">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="font-size: 1.3rem; color: var(--gold-light);">📜 歷史覺察歷程</h2>
        <span id="journalCount" style="color: var(--text-muted); font-size: 0.85rem;">共 0 篇</span>
      </div>
      <div class="journal-list" id="journalListContainer"></div>
    </section>
  </main>

  <!-- 卡牌詳細資訊 Modal -->

    let AppState = {
      journal: [],
      userNotes: {},
      currentSpread: 'single',
      drawnCards: [],
      flippedCount: 0,
      currentQuiz: null
    };

    function loadSavedData() {
      try {
        const j = localStorage.getItem('tarot_codex_journal');
        if (j) AppState.journal = JSON.parse(j);
        const n = localStorage.getItem('tarot_codex_notes');
        if (n) AppState.userNotes = JSON.parse(n);
      } catch (e) {
        console.error("載入失敗", e);
      }
    }

    function saveAppData() {
      localStorage.setItem('tarot_codex_journal', JSON.stringify(AppState.journal));
      localStorage.setItem('tarot_codex_notes', JSON.stringify(AppState.userNotes));
      renderJournalList();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      const target = document.getElementById(`tab-${tabId}`);
      if (target) target.classList.add('active');
      
      const btns = document.querySelectorAll('.nav-btn');
      if (tabId === 'practice') btns[0].classList.add('active');
      if (tabId === 'quiz') { btns[1].classList.add('active'); if(!AppState.currentQuiz) initNewQuiz(); }
      if (tabId === 'codex') { btns[2].classList.add('active'); renderCodex('all'); }
      if (tabId === 'journal') { btns[3].classList.add('active'); renderJournalList(); }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setSpread(type, elem) {
      AppState.currentSpread = type;
      document.querySelectorAll('.spread-chip').forEach(c => c.classList.remove('active'));
      elem.classList.add('active');
      document.getElementById('cardsDisplayContainer').innerHTML = '';
      document.getElementById('practiceFormBox').style.display = 'none';
      AppState.drawnCards = [];
      AppState.flippedCount = 0;
    }

    // 洗牌發牌：先洗出背面，等待使用者親自點擊翻開
    function shuffleCards() {
      const container = document.getElementById('cardsDisplayContainer');
      container.innerHTML = '';
      AppState.drawnCards = [];
      AppState.flippedCount = 0;
      document.getElementById('practiceFormBox').style.display = 'none';

      let positions = [];
      if (AppState.currentSpread === 'single') {
        positions = [{ name: '直覺指引' }];
      } else if (AppState.currentSpread === 'three') {
        positions = [{ name: '身 (外在環境)' }, { name: '心 (情緒感受)' }, { name: '靈 (潛意識智慧)' }];
      } else {
        positions = [{ name: '過去因果' }, { name: '當前核心' }, { name: '未來走向' }];
      }

      const shuffled = [...TAROT_CARDS].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, positions.length);

      positions.forEach((pos, idx) => {
        const card = selected[idx];
        const isReversed = Math.random() < 0.45;
        AppState.drawnCards.push({ card, isReversed, posName: pos.name, isFlipped: false });

        const col = document.createElement('div');
        col.className = 'card-col';
        col.innerHTML = `
          <div class="pos-label">${pos.name}</div>
          <div class="rws-card ${isReversed ? 'reversed' : ''}" id="card-elem-${idx}" onclick="userFlipCard(${idx})">
            <div class="card-face-back">
              <div class="card-back-ornament"></div>
              <div class="card-click-hint">點擊翻牌 ✦</div>
            </div>
            <div class="card-face-front">
              <img src="${card.img}" alt="${card.name}" onerror="this.src='https://picsum.photos/seed/${card.id}/300/520'">
              <div class="card-badge">${card.name} (${isReversed ? '逆' : '正'})</div>
            </div>
          </div>
          <div style="font-size:0.85rem; color:var(--text-muted); text-align:center; min-height:22px;" id="card-name-${idx}">
            等待揭示...
          </div>
        `;
        container.appendChild(col);
      });

      // 平滑滾動到卡牌區
      container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 使用者親自手動翻開單張卡牌
    function userFlipCard(idx) {
      const info = AppState.drawnCards[idx];
      if (!info || info.isFlipped) return; // 已經翻過就不用再翻

      const cardElem = document.getElementById(`card-elem-${idx}`);
      const nameElem = document.getElementById(`card-name-${idx}`);
      
      cardElem.classList.add('flipped');
      info.isFlipped = true;
      AppState.flippedCount++;

      nameElem.innerHTML = `<strong style="color:var(--gold-light);">${info.card.name}</strong> · <span style="color:${info.isReversed ? 'var(--danger)':'var(--success)'}; font-weight:700;">${info.isReversed ? '逆位' : '正位'}</span>`;

      // 當牌陣中所有的牌都被翻開時，自動展開下方的覺察筆記區
      if (AppState.flippedCount === AppState.drawnCards.length) {
        const formBox = document.getElementById('practiceFormBox');
        formBox.style.display = 'block';
        setTimeout(() => {
          formBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 300);
      }
    }

    function savePracticeToJournal() {
      const q = document.getElementById('practiceQuestion').value.trim() || '每日覺察練習';
      const intuition = document.getElementById('practiceIntuition').value.trim();
      const action = document.getElementById('practiceAction').value.trim();

      if (!AppState.drawnCards.length || AppState.flippedCount < AppState.drawnCards.length) {
        alert('請先將所有的牌卡都翻開揭曉喔！');
        return;
      }

      const entry = {
        id: 'entry_' + Date.now(),
        date: new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour:'2-digit', minute:'2-digit' }),
        type: '覺察抽牌',
        spreadName: AppState.currentSpread === 'single' ? '單張直覺' : (AppState.currentSpread === 'three' ? '身心靈三牌陣' : '時間之流'),
        question: q,
        cards: AppState.drawnCards.map(d => ({
          cardId: d.card.id,
          name: d.card.name,
          en: d.card.en,
          img: d.card.img,
          isReversed: d.isReversed,
          posName: d.posName
        })),
        intuition: intuition,
        action: action
      };

      AppState.journal.unshift(entry);
      saveAppData();
      alert('✨ 成功儲存！本次覺察已歸檔至【塔羅日記】與各牌卡【個人典籍紀錄】中！');

      document.getElementById('practiceQuestion').value = '';
      document.getElementById('practiceIntuition').value = '';
      document.getElementById('practiceAction').value = '';
      document.getElementById('practiceFormBox').style.display = 'none';
      document.getElementById('cardsDisplayContainer').innerHTML = '';
      AppState.drawnCards = [];
      AppState.flippedCount = 0;
    }

    function generateShareImage() {
      if (!AppState.drawnCards.length || AppState.flippedCount < AppState.drawnCards.length) {
        alert('請先翻開全部牌面！');
        return;
      }
      const canvas = document.getElementById('shareCanvas');
      const ctx = canvas.getContext('2d');
      const q = document.getElementById('practiceQuestion').value.trim() || '每日覺察時刻';
      const intuition = document.getElementById('practiceIntuition').value.trim() || '向內觀照，看見當下最真實的能量指引。';

      ctx.fillStyle = '#0d101d';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 4;
      ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);
      ctx.strokeStyle = 'rgba(212, 175, 55, 0.4)';
      ctx.lineWidth = 1;
      ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);

      ctx.fillStyle = '#f3e5ab';
      ctx.font = 'bold 36px "Noto Serif TC", serif';
      ctx.textAlign = 'center';
      ctx.fillText('✦ 塔羅覺察隨筆 ✦', canvas.width / 2, 110);

      ctx.fillStyle = '#9aa5b8';
      ctx.font = '22px "Noto Serif TC", serif';
      ctx.fillText(new Date().toLocaleDateString('zh-TW') + ' · ' + q, canvas.width / 2, 160);

      const count = AppState.drawnCards.length;
      const cardW = count === 1 ? 240 : (count === 3 ? 180 : 200);
      const cardH = cardW * 1.72;
      const totalW = count * cardW + (count - 1) * 30;
      let startX = (canvas.width - totalW) / 2;
      const cardY = 220;

      let loadedImages = 0;
      AppState.drawnCards.forEach((d, idx) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          ctx.save();
          const cx = startX + idx * (cardW + 30) + cardW / 2;
          const cy = cardY + cardH / 2;

          ctx.translate(cx, cy);
          if (d.isReversed) ctx.rotate(Math.PI);
          ctx.drawImage(img, -cardW / 2, -cardH / 2, cardW, cardH);
          ctx.restore();

          ctx.fillStyle = '#d4af37';
          ctx.font = 'bold 22px "Noto Serif TC", serif';
          ctx.fillText(`${d.card.name} (${d.isReversed ? '逆' : '正'})`, cx, cardY + cardH + 36);

          loadedImages++;
          if (loadedImages === count) {
            drawShareTextAndFinish(ctx, canvas, intuition);
          }
        };
        img.onerror = () => {
          ctx.fillStyle = '#1c233a';
          const x = startX + idx * (cardW + 30);
          ctx.fillRect(x, cardY, cardW, cardH);
          ctx.strokeStyle = '#d4af37';
          ctx.strokeRect(x, cardY, cardW, cardH);
          ctx.fillStyle = '#f3e5ab';
          ctx.font = '20px serif';
          ctx.fillText(d.card.name, x + cardW / 2, cardY + cardH / 2);

          loadedImages++;
          if (loadedImages === count) {
            drawShareTextAndFinish(ctx, canvas, intuition);
          }
        };
        img.src = d.card.img;
      });
    }

    function drawShareTextAndFinish(ctx, canvas, text) {
      ctx.fillStyle = 'rgba(22, 27, 43, 0.85)';
      ctx.roundRect(80, 720, canvas.width - 160, 360, 16);
      ctx.fill();
      ctx.strokeStyle = '#2e3856';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.fillStyle = '#d4af37';
      ctx.font = 'bold 24px "Noto Serif TC", serif';
      ctx.textAlign = 'left';
      ctx.fillText('【 直覺覺察之音 】', 120, 780);

      ctx.fillStyle = '#f0f2f5';
      ctx.font = '22px "Noto Serif TC", serif';
      wrapText(ctx, text, 120, 830, canvas.width - 240, 36);

      ctx.fillStyle = '#9aa5b8';
      ctx.font = '18px "Cinzel", serif';
      ctx.textAlign = 'center';
      ctx.fillText('— TAROT CODEX · INSIGHT & PRACTICE —', canvas.width / 2, 1140);

      const resultUrl = canvas.toDataURL('image/png');
      document.getElementById('shareResultImg').src = resultUrl;
      document.getElementById('downloadShareLink').href = resultUrl;
      document.getElementById('shareImageModal').classList.add('open');
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split('');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n];
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n];
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    function initNewQuiz() {
      const randomCard = TAROT_CARDS[Math.floor(Math.random() * TAROT_CARDS.length)];
      const randomScenario = QUIZ_SCENARIOS[Math.floor(Math.random() * QUIZ_SCENARIOS.length)];
      const isReversed = Math.random() < 0.45;

      AppState.currentQuiz = {
        card: randomCard,
        isReversed: isReversed,
        scenario: randomScenario
      };

      document.getElementById('quizScenario').innerHTML = `<strong>💼 案主情境問題：</strong><br>${randomScenario}`;
      const imgElem = document.getElementById('quizCardImg');
      imgElem.src = randomCard.img;
      imgElem.onerror = () => { imgElem.src = 'https://picsum.photos/seed/' + randomCard.id + '/300/520'; };

      const cardElem = document.getElementById('quizCardElem');
      if (isReversed) cardElem.classList.add('reversed');
      else cardElem.classList.remove('reversed');

      document.getElementById('quizCardBadge').innerText = `${randomCard.name} (${isReversed ? '逆' : '正'})`;
      document.getElementById('quizCardName').innerText = `${randomCard.name} · ${randomCard.en} (${isReversed ? '逆位' : '正位'})`;
      document.getElementById('quizAnswerInput').value = '';
    }

    function submitQuizPractice() {
      const ans = document.getElementById('quizAnswerInput').value.trim();
      if (!ans) {
        alert('請先寫下你的直覺解讀再送出歸檔喔！');
        return;
      }

      const q = AppState.currentQuiz;
      const entry = {
        id: 'quiz_' + Date.now(),
        date: new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit', hour:'2-digit', minute:'2-digit' }),
        type: '出題測驗',
        spreadName: '實戰解讀出題',
        question: q.scenario,
        cards: [{
          cardId: q.card.id,
          name: q.card.name,
          en: q.card.en,
          img: q.card.img,
          isReversed: q.isReversed,
          posName: '核心對應牌'
        }],
        intuition: ans,
        action: `標準參考牌義：${q.card.keywords}。${q.card.meaning}`
      };

      AppState.journal.unshift(entry);
      saveAppData();
      alert('🎯 解讀已成功歸檔！你所寫的解析已同步收錄在「' + q.card.name + '」的卡牌實戰筆記庫中！');

    function renderCodex(filterSuit) {
      const grid = document.getElementById('codexGrid');
      grid.innerHTML = '';

      const filtered = TAROT_CARDS.filter(c => filterSuit === 'all' || c.suit === filterSuit);

      filtered.forEach(c => {
        const count = AppState.journal.filter(j => j.cards && j.cards.some(item => item.cardId === c.id)).length;
        const hasNote = !!AppState.userNotes[c.id];

        const thumb = document.createElement('div');
        thumb.className = 'codex-card-thumb';
        thumb.onclick = () => openCardDetailModal(c.id);
        thumb.innerHTML = `
          <img class="thumb-img" src="${c.img}" alt="${c.name}" onerror="this.src='https://picsum.photos/seed/${c.id}/200/340'">
          <div class="thumb-info">
            <div class="thumb-title">${c.name}</div>
            <div class="thumb-count">${count} 次練習 ${hasNote ? '· ✦專屬筆記' : ''}</div>
          </div>
        `;
        grid.appendChild(thumb);
      });
    }

    function filterCodex(suit, btnElem) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btnElem.classList.add('active');
      renderCodex(suit);
    }

    let currentModalCardId = null;
    function openCardDetailModal(cardId) {
      currentModalCardId = cardId;
      const c = TAROT_CARDS.find(item => item.id === cardId);
      if (!c) return;

      const img = document.getElementById('modalCardImg');
      img.src = c.img;
      img.onerror = () => { img.src = 'https://picsum.photos/seed/' + c.id + '/300/520'; };

      document.getElementById('modalCardName').innerText = c.name;
      document.getElementById('modalCardEnName').innerText = c.en;
      document.getElementById('modalKeywords').innerText = `【關鍵象徵】：${c.keywords}`;
      document.getElementById('modalClassicMeaning').innerText = c.meaning;

      document.getElementById('modalUserPersonalNote').value = AppState.userNotes[c.id] || '';

      const historyLogsContainer = document.getElementById('modalHistoryLogs');
      const relatedLogs = AppState.journal.filter(j => j.cards && j.cards.some(item => item.cardId === c.id));
      if (!relatedLogs.length) {
        historyLogsContainer.innerHTML = '<em>尚無此牌的抽牌與解題紀錄。</em>';
      } else {
        historyLogsContainer.innerHTML = relatedLogs.map(log => `
          <div style="border-bottom: 1px solid var(--card-border); padding: 6px 0; margin-bottom: 6px;">
            <div style="color: var(--gold-light);">${log.date} · ${log.question}</div>
            <div style="color: var(--text-main); margin-top: 2px;">我的解析：${log.intuition || '無'}</div>
          </div>
        `).join('');
      }

      document.getElementById('cardDetailModal').classList.add('open');
    }

      if (!currentModalCardId) return;

      AppState.userNotes[currentModalCardId] = note;

            ${j.cards.map(c => `
              <div class="mini-card ${c.isReversed ? 'rev' : ''}" title="${c.name} (${c.isReversed ? '逆' : '正'})">
                <img src="${c.img}" alt="${c.name}" onerror="this.src='https://picsum.photos/seed/${c.cardId}/100/170'">
              </div>
            `).join('')}
            <div style="font-size: 0.85rem; color: var(--gold-light);">
              ${j.cards.map(c => `${c.posName ? c.posName + ': ' : ''}<strong>${c.name}</strong>(${c.isReversed ? '逆' : '正'})`).join('、 ')}
            </div>
          </div>

          <div style="background: rgba(13, 15, 23, 0.6); padding: 10px 14px; border-radius: 8px; margin-top: 8px; font-size: 0.88rem; line-height: 1.5;">
            <div><strong style="color: var(--gold);">直覺解讀：</strong>${j.intuition}</div>
            ${j.action ? `<div style="margin-top: 4px;"><strong style="color: var(--accent);">行動覺察：</strong>${j.action}</div>` : ''}
          </div>
        </div>
      `).join('');
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(AppState));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `tarot_codex_backup_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importDataPrompt() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const data = JSON.parse(ev.target.result);
            if (data.journal) AppState.journal = data.journal;
            if (data.userNotes) AppState.userNotes = data.userNotes;
            saveAppData();
            alert('🎉 備份資料匯入成功！');
            renderCodex('all');
          } catch (err) {
            alert('檔案格式錯誤，無法解析！');
          }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function closeModal(e, id) {
      if (e.target.id === id) document.getElementById(id).classList.remove('open');
    }
    function closeModalDirect(id) {
      document.getElementById(id).classList.remove('open');
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadSavedData();
    });
  </script>
</body>
</html>
